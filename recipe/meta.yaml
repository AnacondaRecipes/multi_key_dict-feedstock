{% set name = "multi_key_dict" %}
{% set version = "2.0.4" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 34b0fece445cae0147f0dcd542290ec8cab83a800535890a6b7c615c0c779d08

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation
  skip: true  # [py<36]

requirements:
  host:
    - pip
    - python
    - setuptools >=77
  run:
    - python

test:
  imports:
    - multi_key_dict
  requires:
    - python
  commands:
    - pip check

about:
  home: https://github.com/formiaczek/multi_key_dict
  license: MIT
  license_family: MIT
  license_file: {{ environ["RECIPE_DIR"] }}/LICENSE
  summary: Multi key dictionary implementation

extra:
  recipe-maintainers:
    - nicoddemus
